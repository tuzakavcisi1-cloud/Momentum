name: ci

on:
  workflow_dispatch: {}
  push:
    branches: [main]

defaults:
  run:
    working-directory: src/client

jobs:
  istemci:
    runs-on: ubuntu-latest
    # [Onur, 15 Agu 2026] Kosucu UTC'dir; "gece yarisi devrilmesi" ayaklari
    # orada VAKUMDUR (yerel == UTC olunca iki takvim gunu ayrisamaz). Testler
    # gercek kullanicinin saat diliminde kosar.
    # OLCULDU (15 Agu 2026, 19:24 UTC -- 676/676 ucunde de yesil):
    #   Europe/Istanbul  · Pacific/Midway (UTC-11, ayni takvim gunu)
    #   Pacific/Kiritimati (UTC+14) -- yerel TARIH, UTC tarihinden FARKLI:
    #   UTC 15 Agu 19:24 iken yerel 16 Agu 09:24. Gun ayrisma ayagi BUDUR.
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
      - run: flutter analyze --fatal-infos
      - run: flutter test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
      - run: flutter build ios --no-codesign

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: pwsh --version
        shell: pwsh
      - run: docker info
        shell: pwsh
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: ./araclar/verify.ps1
        shell: pwsh
