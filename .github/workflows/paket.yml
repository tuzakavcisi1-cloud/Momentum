name: paket

# TEK-KOMUT KAPISI — ODEV §8(4)'un iddiasini MEKANIK olarak olcer:
# "degerlendirici `docker compose up` yazar ve calisan uygulamayi gorur".
# Bu iddia ne bulut kabugunda ne masaustu VM'inde olculebilir (ikisinde de docker
# daemon yok) ⇒ TEK olcum yeri burasi.
#
# 🔴 BU KAPININ ILK SURUMU KORDU (o79 bagimsiz denetimi, 16 Agu 2026).
# Denetci `Istemci:KokDizin`e YALNIZ index.html koyup API'yi kaldirdi: Flutter
# ciktisinin tamami (flutter_bootstrap.js, main.dart.js) 404 donerken DORT AYAK DA
# YESIL yandi. Sebep: AYAK 1 servis edilen govdede 'flutter_bootstrap.js' DIZESINI
# ariyordu, o dize ise depoda duran SABLONDA (src/client/web/index.html:44) zaten
# vardi. Ayrica migrator esigi `>=3 tablo` idi; denetci yalniz ilk migration'i
# kosturdu, `tasks`/`task_lists` HIC olusmadan 8 tablo cikti, kapi gecti ve
# GET /v1/tasks **500** dondu. Asagidaki surum ikisini de kapatir: varliklarin
# KENDISI cekilir ve URUN UCU cagrilir.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "src/**"
      - "global.json"
      - ".github/workflows/paket.yml"
  workflow_dispatch: {}

jobs:
  tek-komut:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: sistemi tek komutla kaldir
        run: docker compose up --build -d

      - name: migrator BITTI ve SEMANIN TAMAMI kuruldu mu
        shell: bash
        run: |
          set -euo pipefail
          kod=$(docker inspect -f '{{.State.ExitCode}}' momentum-migrator)
          durum=$(docker inspect -f '{{.State.Status}}' momentum-migrator)
          echo "migrator: durum=$durum cikis=$kod"
          [ "$durum" = "exited" ] || { echo "KIRMIZI: migrator bitmedi"; exit 1; }
          [ "$kod" = "0" ] || { echo "KIRMIZI: migrator cikis kodu $kod"; exit 1; }
          # SAYMA, ADLARINI SOR. `>=3 tablo` esigi yarim uygulanmis semayi
          # geciriyordu (denetim olcumu: 8 tablo, tasks/task_lists YOK, kapi yesil).
          eksik=$(docker compose exec -T postgres psql -U "${POSTGRES_USER:-momentum}" -d momentum -tAc \
            "select coalesce(string_agg(t, ','), '') from unnest(array[
               'tasks','task_lists','task_tags','outbox_messages','processed_operations',
               'sync_scalar_meta','sync_orset_tags','sync_orset_removes'
             ]) t where to_regclass('public.' || quote_ident(t)) is null")
          eksik=$(echo "$eksik" | tr -d '[:space:]')
          [ -z "$eksik" ] || { echo "KIRMIZI: sema EKSIK -- olusmayan tablolar: $eksik"; exit 1; }
          echo "YESIL: migrator cikis 0 ve semanin sekiz ana tablosu da yerinde"

      - name: hazirlik (dis yoklama -- imajda curl YOK, bilerek)
        shell: bash
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5298/health/ready >/dev/null 2>&1; then
              echo "hazir (deneme $i)"; exit 0
            fi
            sleep 2
          done
          echo "KIRMIZI: /health/ready 120 sn icinde 200 donmedi"; exit 1

      - name: AYAK 1 -- istemci GERCEKTEN derlendi mi (kabuk degil, VARLIKLAR)
        shell: bash
        run: |
          set -euo pipefail
          govde=$(curl -fsS http://localhost:5298/)
          [ -n "$govde" ] || { echo "KIRMIZI: kok bos dondu"; exit 1; }
          grep -q 'flutter_bootstrap.js' <<<"$govde" \
            || { echo "KIRMIZI: kokte SPA kabugu yok -- Istemci:KokDizin baglanmamis"; exit 1; }

          # 1a: kabugun REFERANS ETTIGI dosya GERCEKTEN inmeli. Kor kapiyi kapatan
          # satir budur: sablon dizesi degil, varligin kendisi olculur.
          onyukleyici=$(curl -fsS http://localhost:5298/flutter_bootstrap.js) \
            || { echo "KIRMIZI: flutter_bootstrap.js INMIYOR -- derleme ciktisi imajda yok"; exit 1; }
          [ -n "$onyukleyici" ] || { echo "KIRMIZI: flutter_bootstrap.js bos"; exit 1; }

          # 1b: CDN yasagi PAKET yolunda da zorlanir. pages.yml'de bu kapi vardi,
          # imaj AYRI bir derleme oldugu icin orada yoktu (denetim bulgusu M6).
          # Bayrak duserse CanvasKit gstatic'ten cekilir, COEP `require-corp`
          # altinda bloklanir ⇒ BEYAZ EKRAN.
          grep -q '"useLocalCanvasKit":true' <<<"$onyukleyici" \
            || { echo "KIRMIZI: useLocalCanvasKit yok -- --no-web-resources-cdn dusmus"; exit 1; }

          # 1c + 1d: uygulama kodunu BIR KEZ dosyaya indir, iki seyi olc.
          #
          # 🔴 `curl ... | grep -q ...` YAZILMAZ (kosum 6'da olculdu): grep eslesmeyi
          # BULUNCA hemen cikar ve boruyu kapatir, curl `23 -- Failure writing output
          # to destination` ile duser, `pipefail` bunu ayagin KIRMIZISINA cevirir.
          # Yani dize BULUNDUGU HALDE kapi kirmizi yandi -- kor kapinin aynadaki
          # goruntusu: YALANCI KIRMIZI. Once indir, sonra dosyada ara.
          curl -fsS http://localhost:5298/main.dart.js -o /tmp/main.dart.js \
            || { echo "KIRMIZI: main.dart.js INMIYOR"; exit 1; }
          bayt=$(stat -c '%s' /tmp/main.dart.js)
          echo "main.dart.js: $bayt bayt"
          [ "$bayt" -gt 100000 ] \
            || { echo "KIRMIZI: main.dart.js $bayt bayt -- derlenmis uygulama yok"; exit 1; }

          # DEV_USER_ID derlemeye GERCEKTEN girdi mi (denetim bulgusu M3): compose'daki
          # argumanin adi yanlis yazilsa Docker yalnizca "unused build arg" uyarisi
          # verir, istemci BOS define ile derlenir, her kurulum RASTGELE kullanici
          # uretir ve telefon ile tarayici birbirini gormez.
          grep -q 'deadbeef-0000-4000-8000-000000000001' /tmp/main.dart.js \
            || { echo "KIRMIZI: DEV_USER_ID derlemeye GIRMEMIS -- iki istemci ayni kullanici olmaz"; exit 1; }

          echo "YESIL: kabuk + onyukleyici + uygulama kodu + demo kimligi ayni kokende, CDN kapali"

      - name: AYAK 2 -- COOP/COEP/CORP istemci BELGESINE degiyor mu
        shell: bash
        run: |
          set -euo pipefail
          basliklar=$(curl -fsS -D - -o /dev/null http://localhost:5298/)
          # NOT: burada "govde bos mu" turu bir pozitif kontrol YAZILMADI -- `curl -f`
          # basariliysa cikti asla bos olamaz, o satir olu koddur (denetim bulgusu m6).
          # Bu ayagin gercek pozitif kontrolu MUTANTTIR: `Izolasyon__Etkin=false` ile
          # ayak KIRMIZI yanar, digerleri yesil kalir (denetimde olculdu).
          for b in 'cross-origin-opener-policy: *same-origin' \
                   'cross-origin-embedder-policy: *require-corp' \
                   'cross-origin-resource-policy: *same-origin'; do
            grep -iq "$b" <<<"$basliklar" \
              || { echo "KIRMIZI: baslik YOK -> $b"; exit 1; }
          done
          echo "YESIL: izolasyon basliklari istemci belgesinde"

      - name: AYAK 3 -- varsayilan-ret gercek mi (401) ve dev-kimlikle gecis (200)
        shell: bash
        run: |
          set -euo pipefail
          govde='{"clientId":"11111111-1111-1111-1111-111111111111","ops":[]}'
          ret=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5298/v1/sync \
                  -H 'Content-Type: application/json' -d "$govde")
          [ "$ret" = "401" ] || { echo "KIRMIZI: basliksiz /v1/sync $ret dondu, 401 bekleniyordu"; exit 1; }
          gec=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5298/v1/sync \
                  -H 'Content-Type: application/json' \
                  -H 'X-Momentum-Dev-User: 22222222-2222-2222-2222-222222222222' -d "$govde")
          [ "$gec" = "200" ] || { echo "KIRMIZI: dev-kimlikli /v1/sync $gec dondu, 200 bekleniyordu"; exit 1; }
          echo "YESIL: 401 -> 200"

      - name: AYAK 4 -- URUN UCU calisiyor mu (yarim semayi yakalar)
        shell: bash
        run: |
          set -euo pipefail
          # Denetim olcumu: yarim uygulanmis semada /health/ready 200 donuyor ama
          # GET /v1/tasks 500 veriyor. Hazirlik yoklamasi BAGLANTIYI olcer, SEMAYI degil.
          kod=$(curl -s -o /tmp/tasks.json -w '%{http_code}' http://localhost:5298/v1/tasks \
                  -H 'X-Momentum-Dev-User: 22222222-2222-2222-2222-222222222222')
          echo "GET /v1/tasks -> $kod"
          [ "$kod" = "200" ] || { echo "KIRMIZI: urun ucu $kod dondu; govde:"; cat /tmp/tasks.json; exit 1; }
          echo "YESIL: urun okuma ucu 200"

      - name: AYAK 5 -- eslesmeyen API yolu HTML DONMUYOR (o63 olcumu)
        shell: bash
        run: |
          set -euo pipefail
          kod=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5298/v1/BULUNMAYAN-UC)
          [ "$kod" = "404" ] || { echo "KIRMIZI: /v1/BULUNMAYAN-UC $kod dondu, 404 bekleniyordu"; exit 1; }
          echo "YESIL: SPA geri-dususu API yollarini yutmuyor"

      - name: kirmizida gunlukler
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: temizle
        if: always()
        run: docker compose down -v
