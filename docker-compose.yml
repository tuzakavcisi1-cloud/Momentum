# Dev-only PostgreSQL for Momentum (GOREV slice-2b1 D1).
# Secrets NEVER in the repo: the password is env-driven with an OBVIOUS dev default.
# The API reads ConnectionStrings:Momentum from user-secrets / env, never from a committed file.
services:
  postgres:
    image: postgres:17-alpine
    container_name: momentum-postgres
    environment:
      POSTGRES_DB: momentum
      POSTGRES_USER: ${POSTGRES_USER:-momentum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentum_dev}
    ports:
      - "5432:5432"
    volumes:
      - momentum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentum} -d momentum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  momentum-pgdata:
